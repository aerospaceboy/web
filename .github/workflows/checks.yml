name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PIP_CACHE_DIR: .cache/pip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python .make-posts.py --dry-run
      - run: python -m blog_tools.build
      - run: node --check customization/mobile-navigation.js
      - run: node --check customization/header-layout.js
      - run: node --check customization/space-effects.js
      - run: node --check customization/pointer-effects.js
      - run: node --check customization/resume-enhancement.js
